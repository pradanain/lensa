name: Build and publish LENSA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lensa-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements/dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: python -m pip install --require-hashes -r app/requirements/dev.lock
      - run: npm ci
        working-directory: app/web
      - run: npm run build && npm run lint && npm test
        working-directory: app/web
      - run: python -m pytest app/tests -q
      - name: Validate production Compose and deployment script
        run: |
          bash -n app/deploy/deploy.sh
          docker compose --env-file app/deploy/production.env.example -f app/deploy/compose.yml config --quiet
      - run: npx playwright install --with-deps chromium
        working-directory: app/web
      - run: npm run test:e2e
        working-directory: app/web
        env:
          SE2026_TEST_PYTHON: ${{ env.pythonLocation }}/bin/python
          SE2026_BROWSER_CHANNEL: chromium
  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r app/requirements/web.lock
      - name: Rehearse deploy with private UID state and stale global registry credentials
        shell: bash
        run: |
          test ! -e /srv/stacks/lensa/compose.yml
          test ! -e /storage/data/lensa/state/portal.sqlite
          python app/scripts/maintenance/production_smoke.py --prepare .cache/deploy-rehearsal
          sudo mkdir -p /srv/stacks/lensa /storage/data/lensa/{census,state,backups}
          sudo chown "$USER:$USER" /srv/stacks/lensa
          cp app/deploy/{compose.yml,deploy.sh} /srv/stacks/lensa/
          chmod 700 /srv/stacks/lensa/deploy.sh
          sudo install -o root -g 10001 -m 640 .cache/deploy-rehearsal/census.sqlite /storage/data/lensa/census/se2026.sqlite
          sudo install -o 10001 -g 10001 -m 600 .cache/deploy-rehearsal/state/portal.sqlite /storage/data/lensa/state/portal.sqlite
          sudo chown 10001:10001 /storage/data/lensa/{state,backups}
          sudo chmod 700 /storage/data/lensa/{state,backups}
          docker network create cloudflared-net
          subnet=$(docker network inspect cloudflared-net --format '{{(index .IPAM.Config 0).Subnet}}')
          printf 'LENSA_IMAGE=ghcr.io/pradanain/lensa:sha-83511b339a45570897012b76a4f59fc4436d12a7
          LENSA_AUTH_ENABLED=true
          LENSA_TRUSTED_PROXIES=%s
          ' "$subnet" > /srv/stacks/lensa/.env
          mkdir -p .cache/stale-registry
          printf '{"auths":{"ghcr.io":{"auth":"c3ludGhldGljOnN5bnRoZXRpYw=="}}}' > .cache/stale-registry/config.json
          before=$(sha256sum .cache/stale-registry/config.json)
          DOCKER_CONFIG="$PWD/.cache/stale-registry" /srv/stacks/lensa/deploy.sh
          test "$before" = "$(sha256sum .cache/stale-registry/config.json)"
          sudo test -n "$(sudo find /storage/data/lensa/backups -name 'portal-*.sqlite' -print -quit)"
          sudo test -n "$(sudo find /storage/data/lensa/backups -name 'config-*.tar.gz' -print -quit)"
          docker compose -p lensa -f /srv/stacks/lensa/compose.yml --env-file /srv/stacks/lensa/.env down
          docker network rm cloudflared-net
  publish:
    needs: [verify, deploy-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: app/deploy/Dockerfile.production
          platforms: linux/amd64
          load: true
          tags: ghcr.io/pradanain/lensa:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pradanain/lensa
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python -m pip install --require-hashes -r app/requirements/dev.lock
      - name: Test container with synthetic data only
        shell: bash
        run: |
          python app/scripts/maintenance/production_smoke.py --prepare .cache/image-smoke
          docker run -d --name lensa-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp \
            -p 127.0.0.1:18800:8000 \
            --mount type=bind,src="$PWD/.cache/image-smoke/census.sqlite",dst=/srv/data/processed/se2026.sqlite,readonly \
            --mount type=bind,src="$PWD/.cache/image-smoke/state",dst=/srv/data/app \
            ghcr.io/pradanain/lensa:sha-${{ github.sha }}
          python app/scripts/maintenance/production_smoke.py --verify http://127.0.0.1:18800
          docker rm -f lensa-smoke
      - name: Publish verified production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: app/deploy/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pradanain/lensa:sha-${{ github.sha }}
            ghcr.io/pradanain/lensa:latest
          labels: |
            org.opencontainers.image.source=https://github.com/pradanain/lensa
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
