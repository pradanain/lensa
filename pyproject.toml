[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se2026-bulungan-local"
version = "0.1.0"
description = "Local audit, versioned SQLite ingestion and SE2026 analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "openpyxl>=3.1"]
web = ["fastapi==0.162.3", "uvicorn==0.54.0", "pwdlib[argon2]==0.3.1", "pydantic-settings==2.16.2"]

[tool.setuptools.packages.find]
where = ["app/src"]

[tool.pytest.ini_options]
pythonpath = ["app/src"]
testpaths = ["app/tests"]
cache_dir = ".cache/pytest"
norecursedirs = ["archive", "data", "SE2026_BULUNGAN_WORKSPACE", ".cache", ".venv", "__pycache__"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
